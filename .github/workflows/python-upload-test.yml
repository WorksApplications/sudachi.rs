name: Python Packages Test

on:
  push:
    branches: [pre/v*]

jobs:
  build-wheels:
    name: build wheels using cibuildwheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6.0.2
      - name: download dictionary for PGO
        if: ${{ matrix.os == 'ubuntu-latest' || matrix.os == 'ubuntu-24.04-arm' }}
        run: bash fetch_dictionary.sh "20220519" "core"
      - name: Setup python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
      - name: Setup uv
        uses: astral-sh/setup-uv@v8.1.0
      - uses: actions/cache@v5.0.5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Modify version for TestPyPI upload
        run: uv run --no-project --with packaging python ./python/modify_version_for_testpypi.py
      - name: cibuildwheel ${{ matrix.os }}
        uses: pypa/cibuildwheel@v3.4.1
        with:
          package-dir: .
          output-dir: python/dist
          config-file: pyproject.toml
          extras: "uv"
        env:
          CIBW_BUILD_FRONTEND: "build[uv]"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: artifact-${{ matrix.os }}
          path: |
            ./python/dist/*.whl
            ./python/dist/*.tar.gz

  build-sdist:
    name: build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: setup python for sdist
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
      - name: Setup uv
        uses: astral-sh/setup-uv@v8.1.0
      - uses: actions/cache@v5.0.5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Modify version for TestPyPI upload
        run: uv run --no-project --with packaging python ./python/modify_version_for_testpypi.py
      - name: build sdist
        working-directory: ./python
        run: bash build-sdist.sh

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: artifact-sdist
          path: |
            ./python/dist/*.whl
            ./python/dist/*.tar.gz

  upload-to-testpypi: # run only if all have succeeded
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: artifact-*
          path: dist/
          merge-multiple: true
      - name: List files to upload
        run: ls -R dist/
      - name: Publish distribution to Test PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.0
        with:
          user: ${{ secrets.PYPI_TEST_USERNAME }}
          password: ${{ secrets.PYPI_TEST_PASSWORD }}
          repository_url: https://test.pypi.org/legacy/
          verbose: true

  install-and-test:
    needs: [upload-to-testpypi]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
        target: ["3.10", "3.11", "3.12", "3.13", "3.13t", "3.14", "3.14t"]
        include:
          - os: "ubuntu-latest"
            target: "sdist"
            python-version: "3.13"
          - os: "ubuntu-latest"
            target: "sdist"
            python-version: "3.14"
        exclude:
          - os: "windows-latest"
            target: "3.13t"
          - os: "windows-latest"
            target: "3.14t"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python-version || matrix.target }}
      - name: Setup uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Show compatible tags
        run: python -m pip debug --verbose
      - name: Install our module from TestPyPi
        if: ${{ matrix.target != 'sdist' }}
        run: uv pip install --system --pre -U --default-index https://test.pypi.org/simple/ SudachiPy
      - name: Install our module from TestPyPi (sdist)
        if: ${{ matrix.target == 'sdist' }}
        run: |
          uv pip install --system -U maturin
          uv pip install --system --pre -U --default-index https://test.pypi.org/simple/ --no-build-isolation --no-binary SudachiPy SudachiPy
      - name: Install dependencies (dictionary)
        # this must be after sudachipy install
        run: uv pip install --system sudachidict_core
      - name: Install dependencies (test pretokenizer)
        run: uv pip install --system tokenizers

      - name: Run test
        working-directory: ./python
        run: python -m unittest
      - name: Check that binary works (C mode)
        run: |
          sudachipy .github/data/input.txt -o result-c.txt
          git diff --color=always --no-index -- result-c.txt .github/data/expected-c.txt
      - name: Check that binary works (A mode)
        run: |
          sudachipy .github/data/input.txt -m A -o result-a.txt
          git diff --color=always --no-index -- result-a.txt .github/data/expected-a.txt
